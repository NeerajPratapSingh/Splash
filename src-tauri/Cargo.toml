[package]
name = "winfiles"
version = "0.1.0"
description = "A fast, lightweight file explorer for Windows"
authors = ["Neeraj Pratap Singh"]
license = "MIT"
edition = "2021"

[lib]
name = "winfiles_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
opener = "0.7"
walkdir = "2"
dirs = "5"
percent-encoding = "2"
png = "0.17"
tauri-plugin-drag = "2.1.1"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
base64 = "0.22"
notify = { version = "8.2.0", default-features = false }
tokio = { version = "1.54.0", default-features = false, features = ["sync"] }

[target.'cfg(windows)'.dependencies]
# Shell thumbnail cache (IShellItemImageFactory) for photo previews,
# modifier-key state during native drags, and drive free space.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
