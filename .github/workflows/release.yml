# Builds the Windows installer and attaches it to a draft GitHub release.
# Trigger: push a tag like `v0.1.0` (git tag v0.1.0 && git push origin v0.1.0),
# or run it manually from the Actions tab. Review the draft, then publish it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "WinFiles ${{ github.ref_name }}"
          releaseBody: |
            Download **WinFiles_*_x64-setup.exe** below and run it (Windows 10/11, 64-bit).
            If SmartScreen warns, click **More info → Run anyway** (the installer isn't code-signed yet).
          releaseDraft: true
          prerelease: false
